# Rebuilds staging's site once the Words page publishes new words (docs/decisions/0127-publishing-the-words.md), or ops
# change how long a kind of visit is booked for, which its prose says: on a ten-minute schedule, which GitHub runs about
# every half hour, it asks staging for its latest publish and its lengths, and builds and deploys mm-site only for a
# pair no run here has built yet. It builds the commit staging's mm-api runs, as
# /api/health names it, never main's head, which may not have passed its checks; and it ships only while staging still
# runs that commit, since a staging deploy that lands meanwhile builds with the published words itself. Production takes
# them with a release.
#
# Secrets, on the GitHub Environment "staging":
#   CLOUDFLARE_API_TOKEN                            staging's deploy token (docs/runbook.md)
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET    Access service token, to read the publish past Access
name: site-words

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# A queue of its own: in the deploy's, a run waiting behind a deploy would cancel the next merge's waiting deploy.
concurrency:
  group: site-words
  cancel-in-progress: false

jobs:
  publish:
    name: publish the site's words to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.maneman.in
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      # The publish and the lengths together, so a length ops change is built as a publish is.
      - name: Staging's latest publish, and its visit lengths
        id: latest
        run: |
          answer=$(curl -fsS --retry 3 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://staging.maneman.in/api/site-words)
          publish=$(echo "$answer" | jq -r '.id // "none"')
          lengths=$(echo "$answer" | jq -c '.lengths // {}' | sha256sum | cut -c1-12)
          echo "id=$publish-$lengths" >> "$GITHUB_OUTPUT"

      - name: The commit staging runs
        id: running
        if: steps.latest.outputs.id != 'none'
        run: |
          sha=$(curl -fsS --retry 3 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://staging.maneman.in/api/health | jq -r '.commit // empty')
          if [ -z "$sha" ]; then echo "::error::staging's health names no commit"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The key is the publish: a hit means a run here built it already. The key is saved only once this job passes.
      - name: Built already?
        id: built
        if: steps.latest.outputs.id != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .site-words-built
          key: site-words-staging-${{ steps.latest.outputs.id }}
          lookup-only: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.id != 'none' && steps.built.outputs.cache-hit != 'true'
        with:
          ref: ${{ steps.running.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.latest.outputs.id != 'none' && steps.built.outputs.cache-hit != 'true'

      - name: Build the site (staging), with the words published for it
        if: steps.latest.outputs.id != 'none' && steps.built.outputs.cache-hit != 'true'
        run: npm run build:site -- --env staging --words

      # A staging deploy that landed while this built carries the words already, and is newer than this build.
      - name: Deploy mm-site, while staging still runs the commit built
        if: steps.latest.outputs.id != 'none' && steps.built.outputs.cache-hit != 'true'
        env:
          PUBLISH: ${{ steps.latest.outputs.id }}
          SHA: ${{ steps.running.outputs.sha }}
        run: |
          now=$(curl -fsS --retry 3 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://staging.maneman.in/api/health | jq -r '.commit // empty')
          if [ "$now" != "$SHA" ]; then
            echo "::notice::staging moved to $now while this built $SHA: its own deploy carries the words"
            exit 0
          fi
          node scripts/release/release.ts ship --worker mm-site --env staging --tag "$SHA" --message "words $PUBLISH on $SHA"
          echo "$PUBLISH" > .site-words-built
