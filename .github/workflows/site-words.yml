# Rebuilds staging's site once the Words page publishes new words (docs/decisions/0127-publishing-the-words.md):
# every ten minutes it asks staging for its latest publish, and builds and deploys mm-site only for one no run here
# has built yet. A staging deploy builds with the published words too; production takes them with a release.
#
# Secrets, on the GitHub Environment "staging":
#   CLOUDFLARE_API_TOKEN                            staging's deploy token (docs/runbook.md)
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET    Access service token, to read the publish past Access
name: site-words

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deploy of staging at a time, a merge's or a publish's.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  publish:
    name: publish the site's words to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.maneman.in
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      SHA: ${{ github.sha }}
    steps:
      - name: Staging's latest publish
        id: latest
        run: |
          id=$(curl -fsS --retry 3 \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://staging.maneman.in/api/site-words | jq -r '.id // "none"')
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # The key is the publish: a hit means a run here built it already. The key is saved only once this job passes.
      - name: Built already?
        id: built
        if: steps.latest.outputs.id != 'none'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .site-words-built
          key: site-words-staging-${{ steps.latest.outputs.id }}
          lookup-only: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.id != 'none' && steps.built.outputs.cache-hit != 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.latest.outputs.id != 'none' && steps.built.outputs.cache-hit != 'true'

      - name: Build the site (staging), with the words published for it
        if: steps.latest.outputs.id != 'none' && steps.built.outputs.cache-hit != 'true'
        run: npm run build:site -- --env staging --words

      - name: Deploy mm-site
        if: steps.latest.outputs.id != 'none' && steps.built.outputs.cache-hit != 'true'
        env:
          PUBLISH: ${{ steps.latest.outputs.id }}
        run: |
          node scripts/release/release.ts ship --worker mm-site --env staging --tag "$SHA" --message "words $PUBLISH on $SHA"
          echo "$PUBLISH" > .site-words-built
