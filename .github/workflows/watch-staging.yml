# Every hour, staging as a visitor and its apps find it: mm-api's health, with the cron's last run, the site's pages,
# each app host serving its app (scripts/release/smoke.ts), and every Worker's triggers attached. It changes nothing. A failure opens an issue, or adds
# to the open one, so whoever watches the repository hears of it; the next pass closes nothing by itself.
name: watch staging

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-staging
  cancel-in-progress: true

jobs:
  watch:
    name: staging answers as it should
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The API, the cron and the site
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run smoke -- --base https://staging.maneman.in --environment staging
      - name: Each app host and its app
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run smoke -- --environment staging --surfaces
      # A deploy uploads code but never attaches a new cron, queue consumer or workflow (docs/decisions/0010), and its own
      # check only warns, so a Worker left without one is caught here, within the hour.
      - name: Every cron, queue consumer and workflow attached
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/release/check-triggers.ts staging --strict

  tell:
    name: tell whoever watches the repository
    needs: watch
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/page
        with:
          title: "Staging failed its hourly watch"
          url: ${{ secrets.URGENT_PUSH_URL }}
      - uses: ./.github/actions/failing-issue
        with:
          title: "Staging is failing its hourly watch"
          body: "The hourly watch of staging failed"
          token: ${{ github.token }}
