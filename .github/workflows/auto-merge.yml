# A ready pull request from a branch of this repository merges itself once its CI run passes, and its merge deploys to
# staging (docs/decisions/0006-deployment-pipeline.md, "Merged when green"). One that touches money or personal data
# waits for the reviewed label, and one labelled hold-for-review waits whatever it touches; the decision is
# scripts/lib/auto-merge.ts.
#
# It runs main's own scripts with a write token, never the pull request's code.
name: auto-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: merge when green
    # The repository is public: a fork's pull request is never merged by this job.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Merge the pull request if it should merge itself, and deploy the merge to staging
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/auto-merge.ts --repository "$GITHUB_REPOSITORY" --run "$RUN_ID"
