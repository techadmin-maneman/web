# Books one test consultation on staging through the site's form, POST /api/consultation,
# to check that the booking path reaches Zoho: after a Zoho change, a token rotation,
# or a deploy. Then look for its lead in the CRM and its visit in FSM, both in the
# owner's real org (docs/runbook.md, "Checking the booking path on staging").
name: staging-lead

on:
  workflow_dispatch:
    inputs:
      pincode:
        description: A pincode staging serves.
        default: "122018"
        type: string
      window:
        description: morning, afternoon or evening, on the last day the form offers
        default: morning
        type: string

permissions:
  contents: read

jobs:
  lead:
    name: book a test consultation on staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PINCODE: ${{ inputs.pincode }}
      WINDOW: ${{ inputs.window }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/staging/staging-lead.ts --pincode "$PINCODE" --window "$WINDOW"
