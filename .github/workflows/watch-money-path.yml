# Every night, staging's money path as a client walks it: a service visit held, its payment started, which has
# Razorpay (test mode) make an order, and the hold let go (scripts/release/money-path.ts). Nothing is paid. A failure
# opens an issue, or adds to the open one, as the hourly watch's does.
name: watch the money path

on:
  schedule:
    # 2:47 am in India, before the nightly browser run and while nobody books.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-money-path
  cancel-in-progress: false

jobs:
  walk:
    name: a client books and lets go on staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Hold, start the payment, let go
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run watch:money-path

  tell:
    name: tell whoever watches the repository
    needs: walk
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/failing-issue
        with:
          title: "Staging's money path is failing its nightly walk"
          body: "The nightly walk of staging's money path failed"
          token: ${{ github.token }}
