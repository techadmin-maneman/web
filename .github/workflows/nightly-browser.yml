# Every night, the browser tests on main, with a flaky test failing the run, and the fidelity pairs shot afresh. A pull
# request's run retries a failed test once and passes when the retry does, so a test that fails some of the time never
# shows there; here it fails the run, and an issue tells whoever watches the repository (docs/runbook/ci-runner.md,
# "Flaky browser tests").
name: nightly browser tests

on:
  schedule:
    # 3 am in India.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: browser tests, a flaky one failing the run
    # Ubuntu 24.04, not ubuntu-latest: on 26.04 Playwright's WebKit cannot find the ICU 74 library it is built against.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The system libraries' packages, kept in main's cache as ci.yml's browser job keeps them, under the same key: a
      # pull request's run reads its own branch's cache and main's, so this run is what lets its first find them.
      - name: Which Playwright
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The system libraries' packages, from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: apt's downloads kept where the cache finds them
        run: |
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME/apt-archives" \
            | sudo tee /etc/apt/apt.conf.d/99-kept-packages > /dev/null
      - name: Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: apt's downloads given back to the runner, for the cache
        run: sudo chown -R "$(id -un)" ~/apt-archives
      - name: Local secrets, and every migration applied to an empty D1
        run: |
          node scripts/dev/ensure-dev-vars.ts
          npm run db:local
      - name: Build the site and the Phase 2 apps (local)
        run: |
          npm run build:site -- --env local
          npm run build:app -- --env local
          npm run build:ops -- --env local
          npm run build:tech -- --env local
      - name: Every browser-test project, each failure retried once, and a pass on the retry counted as a failure
        run: npm run test:e2e -- --fail-on-flaky-tests
      - name: Traces of failed and flaky tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The design's frames beside the builds (docs/fidelity-method.md), shot fresh each night, so a pair is never older
  # than a day and a script a change broke fails the run. The pairs are the run's artifact.
  fidelity:
    name: the design's frames beside the builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the site and the Phase 2 apps (local)
        run: |
          npm run build:site -- --env local
          npm run build:app -- --env local
          npm run build:ops -- --env local
          npm run build:tech -- --env local
      - name: Every fidelity pair, the site's, the referral landing's and each app's
        run: |
          npm run fidelity
          npm run fidelity:refer
          npm run fidelity:app
          npm run fidelity:ops
          npm run fidelity:tech
      - name: The pairs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fidelity-pairs
          path: docs/fidelity/
          retention-days: 14

  tell:
    name: tell whoever watches the repository
    needs: [browser, fidelity]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/failing-issue
        with:
          title: "The nightly browser tests are failing"
          body: "Last night's run failed, its traces in the run's artifact"
          token: ${{ github.token }}
