# Checks each environment's CI secrets against docs/runbook.md, step 6: the
# Cloudflare token reaches its own Workers and database and nothing else it
# should not, and the Access service token gets past Access (staging's on its
# hosts, production's on the ops console) where nothing else does.
# Run it after creating or rotating a secret. Read-only apart from one no-op
# write; see scripts/verify-ci-token.ts.
name: verify-ci-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ matrix.environment }} secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/verify-ci-token.ts ${{ matrix.environment }}
