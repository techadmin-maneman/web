# Production release, started by hand for a commit on main that passed staging.
#
#   record what serves -> check the database -> upload the new mm-api version -> migrate
#   -> send it 10% of traffic -> smoke it -> soak, watching its errors -> smoke it again -> 100% -> smoke
#   -> deploy mm-site, mm-app, mm-ops and mm-tech -> smoke every host
#
# If anything fails after traffic starts moving, every Worker goes back to the
# version that was serving before, whatever its own deploy step did. Migrations
# are not rolled back; every migration works with the previous code
# (docs/decisions/0006-deployment-pipeline.md).
#
# Runs in the GitHub Environment "production". Required reviewers get added
# there when the GitHub plan allows it (docs/decisions/0008-owner-decisions-on-platform-constraints.md).
#
# Secrets, on the GitHub Environment "production":
#   CLOUDFLARE_API_TOKEN                            production's deploy token (docs/runbook.md)
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET    Access service token, so the smoke suite gets past Access on the apps' hosts
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main to release. It must have passed deploy-staging.
        required: true
        type: string
      canary_percent:
        description: Share of traffic the new mm-api version gets first (1-50).
        default: "10"
        type: string
      soak_seconds:
        description: How long the canary serves before promotion.
        default: "300"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  eligible:
    name: commit is on main and passed staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: The commit is on main
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA"
            exit 1
          fi
          # "ahead" or "identical" means main contains the commit.
          status=$(gh api "repos/${{ github.repository }}/compare/$SHA...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error::$SHA is not on main (compare status: $status)"
            exit 1
          fi

      - name: The commit passed staging
        run: |
          passed=$(gh run list --repo "${{ github.repository }}" --workflow deploy-staging.yml \
            --commit "$SHA" --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::$SHA has no successful deploy-staging run"
            exit 1
          fi

  release:
    name: release production
    needs: eligible
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://maneman.in
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHA: ${{ inputs.sha }}
      CANARY: ${{ inputs.canary_percent }}
      SOAK: ${{ inputs.soak_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Check the inputs and setup
        run: |
          if ! [[ "$CANARY" =~ ^[0-9]+$ ]] || [ "$CANARY" -lt 1 ] || [ "$CANARY" -gt 50 ]; then
            echo "::error::canary_percent must be a number from 1 to 50"
            exit 1
          fi
          if ! [[ "$SOAK" =~ ^[0-9]+$ ]]; then
            echo "::error::soak_seconds must be a number"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The GitHub Environment 'production' has no CLOUDFLARE_API_TOKEN. See docs/runbook.md."
            exit 1
          fi
          npm run check:config -- --require-provisioned

      # "" only for an app not yet deployed in production (docs/runbook.md, step 11). Anything else Cloudflare
      # cannot answer, and a Worker that must be there and is not, stops the release here.
      - name: Record the versions serving now
        id: before
        run: |
          api=$(node scripts/release/release.ts current --worker mm-api --env production)
          site=$(node scripts/release/release.ts current --worker mm-site --env production)
          app=$(node scripts/release/release.ts current --worker mm-app --env production)
          ops=$(node scripts/release/release.ts current --worker mm-ops --env production)
          tech=$(node scripts/release/release.ts current --worker mm-tech --env production)
          {
            echo "api=$api"
            echo "site=$site"
            echo "app=$app"
            echo "ops=$ops"
            echo "tech=$tech"
          } >> "$GITHUB_OUTPUT"

      - name: Check the database is production's, before anything touches it
        run: node scripts/release/mark-database.ts production --check

      - name: Refuse the release while the API's copy waits for the owner's wording
        run: node scripts/release/check-copy.ts api

      # An upload sends no traffic, and fails on a binding whose bucket, queue or database is missing:
      # so a missing resource stops the release here, before any migration runs.
      - name: Upload the new mm-api version (no traffic yet)
        id: api
        run: |
          version=$(node scripts/release/release.ts upload --worker mm-api --env production --tag "$SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Migrate the production database
        run: |
          for attempt in 1 2 3; do
            node node_modules/wrangler/bin/wrangler.js d1 migrations apply maneman-prod --env production --remote && exit 0
            echo "migrations: attempt $attempt failed; Cloudflare may have dropped the reply"
            sleep 15
          done
          exit 1

      - name: Mark the database as production's
        run: node scripts/release/mark-database.ts production

      - name: Send the new version ${{ inputs.canary_percent }}% of traffic
        id: canary
        run: >-
          node scripts/release/release.ts deploy --worker mm-api --env production
          --split "${{ steps.api.outputs.version }}@$CANARY"
          --split "${{ steps.before.outputs.api }}@$((100 - CANARY))"
          --message "canary $SHA"

      # --override pins these requests to the new version, whatever the split.
      - name: Smoke the new version
        run: >-
          npm run smoke -- --base https://maneman.in --environment production
          --override "mm-api-production=${{ steps.api.outputs.version }}"
          --version-id "${{ steps.api.outputs.version }}" --version-tag "$SHA"

      # Real visitors' requests, not only the smoke's: the soak fails if the new version's invocations error
      # much more than the old one's, where the token can read Workers analytics (scripts/lib/soak.ts).
      - name: Let it serve for a while, watching its errors
        run: >-
          node scripts/release/soak.ts --worker mm-api --env production --seconds "$SOAK"
          --new "${{ steps.api.outputs.version }}" --old "${{ steps.before.outputs.api }}"

      - name: Smoke the new version again
        run: >-
          npm run smoke -- --base https://maneman.in --environment production
          --override "mm-api-production=${{ steps.api.outputs.version }}"
          --version-id "${{ steps.api.outputs.version }}" --version-tag "$SHA"

      - name: Send the new version all traffic
        run: >-
          node scripts/release/release.ts deploy --worker mm-api --env production
          --split "${{ steps.api.outputs.version }}@100" --message "release $SHA"

      - name: Smoke mm-api at 100%
        run: >-
          npm run smoke -- --base https://maneman.in --environment production
          --version-id "${{ steps.api.outputs.version }}" --version-tag "$SHA"

      - name: Deploy mm-site
        run: node scripts/release/release.ts ship --worker mm-site --env production --tag "$SHA" --message "release $SHA"

      # mm-app, mm-ops and mm-tech have no route in production until their surface is switched on there
      # (docs/decisions/0026), and their first deploy is a bootstrap (docs/runbook.md, step 11). Until then
      # there is nothing to build or deploy; the production build refuses their placeholder copy anyway.
      - name: Deploy mm-app
        if: steps.before.outputs.app != ''
        run: |
          npm run build:app -- --env production
          node scripts/release/release.ts ship --worker mm-app --env production --tag "$SHA" --message "release $SHA"

      - name: Deploy mm-ops
        if: steps.before.outputs.ops != ''
        run: |
          npm run build:ops -- --env production
          node scripts/release/release.ts ship --worker mm-ops --env production --tag "$SHA" --message "release $SHA"

      - name: Deploy mm-tech
        if: steps.before.outputs.tech != ''
        run: |
          npm run build:tech -- --env production
          node scripts/release/release.ts ship --worker mm-tech --env production --tag "$SHA" --message "release $SHA"

      - name: Final smoke
        run: npm run smoke -- --base https://maneman.in --environment production --version-tag "$SHA"

      # Nothing until a Phase 2 surface is switched on in production. Then mm-api on its host, and the app
      # the host serves at /, built from this commit. ops.maneman.in is behind Access, so it needs the
      # mm-ci-production service token (runbook, step 3).
      - name: Smoke the Phase 2 surfaces
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run smoke -- --environment production --surfaces --version-tag "$SHA"

      # Every Worker goes back to what it served before, whichever step failed: restoring one that still
      # serves its old version changes nothing (scripts/lib/release.ts).
      - name: Roll back
        if: failure() && steps.canary.outcome != 'skipped'
        env:
          API: ${{ steps.before.outputs.api }}
          SITE: ${{ steps.before.outputs.site }}
          APP: ${{ steps.before.outputs.app }}
          OPS: ${{ steps.before.outputs.ops }}
          TECH: ${{ steps.before.outputs.tech }}
        run: |
          echo "::error::Release $SHA failed. Restoring the versions that were serving before it."
          node scripts/release/release.ts restore --env production --message "rollback of $SHA" \
            --to "mm-api=$API" --to "mm-site=$SITE" --to "mm-app=$APP" --to "mm-ops=$OPS" --to "mm-tech=$TECH"
          npm run smoke -- --base https://maneman.in --environment production --version-id "$API"

      # Read-only, and a warning at most: CI cannot apply triggers (docs/decisions/0010-applying-triggers.md).
      - name: The cron schedules and queue consumers live match every Worker's config
        continue-on-error: true
        run: node scripts/release/check-triggers.ts production
