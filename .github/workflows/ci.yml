# Every pull request, and every staging deploy (called from deploy-staging.yml).
#
# Every push to a pull request runs the full suite: the static checks, the unit and contract tests with coverage, the
# build, the browser tests of every app and Lighthouse, the deployed code on new migrations and the local smoke.
# Adding a label starts no run.
#
# No check runs twice on the same files (the owner's choice of 1 October 2026). The static checks, the unit and
# contract tests and the full suite each take as passed what an earlier run passed on exactly these files: in a pull
# request, an earlier run on the same head, and on a staging deploy, the merged pull request's head when the merge has
# its files (scripts/lib/already-checked.ts).
#
# Jobs that do not need each other run side by side, so a run takes the longest
# job's time rather than every job's. The browser tests are the longest, and
# they start at once: nothing waits behind a check it does not need.
#
# `checks` is the one job to depend on. It needs all the others and passes when
# each of them passed or had nothing it could affect, so a documentation-only
# pull request, which skips the jobs a browser or a build would run, is still
# green (docs/decisions/0006-deployment-pipeline.md, "Parallel jobs").
#
# Jobs run on GitHub's runners, named in each job: nothing can send them to the
# owner's retired machine, where on a public repository a fork's pull request
# would run its code (docs/runbook/ci-runner.md, "The CI runner").
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      migrations: ${{ steps.filter.outputs.migrations }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      static-passed: ${{ steps.passed.outputs.static }}
      tests-passed: ${{ steps.passed.outputs.tests }}
      suite-passed: ${{ steps.passed.outputs.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the filter compares with the base branch
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # A pull request's earlier passes count only while this run checks its head's own files: when the head holds all
      # of main, its merge with main is the head itself. A push to main asks which pull request it merged.
      - name: The checks these files already passed
        id: passed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            node scripts/ci/already-checked.ts --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
            node scripts/ci/already-checked.ts --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The pull request does not hold all of main, so these files are new to CI: every check runs."
          fi

      # Nothing outside a pull request is filtered: a staging deploy runs every check but the one
      # comparing with the base, which its pull request ran.
      - name: Anything a build, a Worker or a browser can see, and any migration
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -z "$BASE" ]; then
            echo "Not a pull request: every job runs."
            # The pull request that changed a lockfile verified its signatures.
            { echo "code=true"; echo "migrations=false"; echo "dependencies=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE...HEAD" | tee changed.txt
          # docs/ and design/ are read-only reference, and the notes at the root are read by people.
          # Everything else, src/ and the configs included, can change what a build or a browser sees.
          if grep -qvE '^(docs/.+|design/.+|[^/]+\.md)$' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only documentation changed: the build, the browser tests, Lighthouse and the local smoke have nothing to do."
          fi
          # A change to the check itself runs it too.
          if grep -qE '^(migrations/|scripts/ci/old-code-on-new-schema\.ts$)' changed.txt; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '(^|/)package(-lock)?\.json$' changed.txt; then
            echo "dependencies=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependencies=false" >> "$GITHUB_OUTPUT"
          fi

      # A warning, never a failure.
      - name: Lines changed by hand, against the review budget
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: git diff --numstat "$BASE...HEAD" | node scripts/ci/pr-size.ts

  static:
    name: static checks
    needs: changes
    if: needs.changes.outputs.static-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migrations check compares with the base
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Env types match wrangler.jsonc
        run: npm run check:types
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # ESLint type-checks through ten TypeScript projects at once, which outgrew
        # Node's default heap on the runner (about 2 GB) on 25 September 2026.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run lint
      - name: Workflows
        run: |
          if command -v actionlint > /dev/null; then
            actionlint -color
          else
            docker run --rm -v "$PWD:/repo" --workdir /repo \
              rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
          fi
      - name: Format
        run: npm run format:check
      - name: No dead code in mm-api
        run: npm run check:dead

      - name: Every open point has one number, and every citation names one that exists
        run: npm run check:open-points
      - name: Every environment redeclares every binding
        run: npm run check:config
      - name: A deliberately broken config is rejected
        run: >-
          node scripts/ci/check-wrangler-config.ts
          --api test/fixtures/wrangler/broken-staging-inherits-bindings.jsonc
          --expect-problem "env.staging: queues.producers is not redeclared"
      - name: Migrations are forward-only and applied ones are unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            npm run check:migrations
          else
            npm run check:migrations -- --base "$BASE"
          fi

      - name: Dependency audit
        run: npm run audit
      # npm now and then fails this with EMISSINGSIGNATUREKEY, a registry blip a later try clears; on 28 September
      # 2026 one more try 15 seconds on was not enough three runs in a row. So it tries four times, half a minute
      # apart, and fails the step only if every try fails. On 29 September four tries were not enough either, so it
      # runs only when a pull request changes what is installed: a signature is verified as the lockfile brings a
      # package in, and the lockfile's integrity hash holds every later install to those bytes
      # (test/node/tooling/ci-workflow.test.ts).
      - name: Registry signatures
        if: needs.changes.outputs.dependencies == 'true'
        run: |
          for try in 1 2 3 4; do
            if npm audit signatures; then exit 0; fi
            echo "::warning::the signatures did not verify on try $try of 4"
            if [ "$try" -lt 4 ]; then sleep 30; fi
          done
          exit 1

  # One run of the whole suite, so coverage still measures all of src/ and scripts/lib/: 90% of lines and 80% of
  # branches, with floors of their own for the vendor clients and the release script (vitest.config.ts).
  # It runs whatever changed: it covers src/ and the migrations, and a config
  # change can break it.
  tests:
    name: tests (unit, contract, coverage)
    needs: changes
    if: needs.changes.outputs.tests-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit and contract tests, coverage of lines and branches on src/ and scripts/lib/
        run: npm run test:coverage
      - name: The front ends' coverage, of the apps, the shared packages and the site
        run: npm run test:coverage:front

  # Migrations run before code, so the code now deployed runs on this branch's schema until the deploy, and
  # again after a rollback: its own Worker tests must pass on these migrations (docs/decisions/0006).
  old-code-on-new-schema:
    name: deployed code on these migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true' && needs.changes.outputs.suite-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch's code is read from history
          persist-credentials: false
      # The script needs Node alone; it installs the base's dependencies where it unpacks the base.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
      - name: The base branch's Worker tests, on this branch's migrations
        env:
          BASE: origin/${{ github.base_ref }}
        run: node scripts/ci/old-code-on-new-schema.ts --base "$BASE"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Bundle every Worker for every environment (dry run)
        run: npm run build

  browser:
    name: browser tests and Lighthouse
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # WebKit is the engine an iPhone runs, for the technician app's tech-ios
      # project alone (playwright.config.ts). Everything else is Chromium.
      # On GitHub's runners the browsers are cached by Playwright's version; the
      # system libraries they need are not files a cache can keep, so they are
      # installed either way. The machine's runners keep both on their own disk.
      - name: Which Playwright
        id: playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Playwright's browsers, from the cache
        id: browsers
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: Chromium and WebKit for Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Their system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Local secrets, and every migration applied to an empty D1
        run: |
          node scripts/dev/ensure-dev-vars.ts
          npm run db:local
      - name: Build the site and the Phase 2 apps (local)
        run: |
          npm run build:site -- --env local
          npm run build:app -- --env local
          npm run build:ops -- --env local
          npm run build:tech -- --env local
      - name: Browser tests at 390 and 1440 px, the client and technician apps at 390 and the ops console at 1440, the technician app again on WebKit, against a local mm-api with stub providers
        run: npm run test:e2e

      # After the browser tests, and in their job: Lighthouse measures a page
      # load, so nothing this run starts should be competing for the machine.
      - name: Lighthouse on /, /try, /book, an invite's landing and the client app, mobile profile, against the budgets
        run: npm run lighthouse

      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: lighthouse/
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: smoke (local)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite-passed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Local secrets, and every migration applied to an empty D1
        run: |
          node scripts/dev/ensure-dev-vars.ts
          npm run db:local
      - name: Nothing is left unapplied
        run: |
          node node_modules/wrangler/bin/wrangler.js d1 migrations list DB --local --env="" | tee migrations.txt
          grep -q "No migrations to apply" migrations.txt
      - name: Build the site (local)
        run: npm run build:site -- --env local

      # Each job has a runner of its own, so these ports are this job's alone.
      # Within it, one server at a time, each with its own inspector port: two
      # wrangler dev processes starting together race for the same auxiliary ports.
      - name: Start mm-api and mm-site under wrangler dev
        run: |
          node node_modules/wrangler/bin/wrangler.js dev --env="" --port 8787 --inspector-port 9230 > api.log 2>&1 &
          echo $! > api.pid
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8787/api/health && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8787/api/health || { cat api.log; exit 1; }
          node node_modules/wrangler/bin/wrangler.js dev --config site/wrangler.jsonc --env="" --port 8788 --inspector-port 9231 > site.log 2>&1 &
          echo $! > site.pid
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8788/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8788/ || { cat site.log; exit 1; }
      - name: Smoke suite against local
        run: npm run smoke -- --api-base http://localhost:8787 --site-base http://localhost:8788 --environment local
      - name: A production Worker holding stubs refuses to start
        run: |
          if timeout 60 node node_modules/wrangler/bin/wrangler.js dev --env="" --port 8789 --inspector-port 9232 --var ENVIRONMENT:production > refuse.log 2>&1; then
            cat refuse.log; exit 1
          fi
          grep -q "refuses to start: IMAGE_PROVIDER is a stub in production" refuse.log
      - name: Stop the local servers
        if: always()
        run: |
          for pid in api.pid site.pid; do
            if [ -f "$pid" ]; then kill "$(cat "$pid")" 2> /dev/null || true; fi
          done

  # The job a later run looks for before it takes the build, the browser tests and the smoke as passed on the same
  # files (scripts/lib/already-checked.ts). A job skipped here had nothing it could affect, as the browser tests have
  # for a documentation-only change, or had passed on these files already. When `what changed` failed, every job here
  # was skipped without deciding anything, so this one does not run.
  full-suite:
    name: full suite
    needs: [changes, old-code-on-new-schema, build, browser, smoke]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/ci/ci-gate.ts
            scripts/lib/ci-gate.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Each job of the full suite passed, or had nothing to do
        env:
          RESULTS: |
            old-code-on-new-schema ${{ needs.old-code-on-new-schema.result }}
            build ${{ needs.build.result }}
            browser ${{ needs.browser.result }}
            smoke ${{ needs.smoke.result }}
        run: node scripts/ci/ci-gate.ts "jobs of the full suite"

  # The gate: deploy-staging.yml waits for this workflow, and main's protection
  # waits for this job's name (docs/decisions/0008, when the plan allows it).
  # A job that was skipped had nothing it could affect, or had passed on these files already, which is a pass.
  checks:
    name: checks
    needs: [changes, static, tests, old-code-on-new-schema, build, browser, smoke, full-suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/ci/ci-gate.ts
            scripts/lib/ci-gate.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Every check passed, or had nothing to do
        env:
          RESULTS: |
            changes ${{ needs.changes.result }}
            static ${{ needs.static.result }}
            tests ${{ needs.tests.result }}
            old-code-on-new-schema ${{ needs.old-code-on-new-schema.result }}
            build ${{ needs.build.result }}
            browser ${{ needs.browser.result }}
            smoke ${{ needs.smoke.result }}
            full-suite ${{ needs.full-suite.result }}
        run: node scripts/ci/ci-gate.ts "checks"
