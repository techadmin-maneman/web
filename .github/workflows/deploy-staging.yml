# On every merge to main: run the PR checks again, then migrate the staging
# database, deploy both Workers to staging and smoke-test staging.maneman.in.
#
# Secrets, on the GitHub Environment "staging":
#   CLOUDFLARE_API_TOKEN                            staging's deploy token (docs/runbook.md)
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET    Access service token, so the smoke suite gets past Access
name: deploy-staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy staging
    needs: checks
    runs-on: ${{ vars.CI_RUNNER == 'maneman' && fromJSON('["self-hosted", "maneman"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.maneman.in
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the triggers check compares with the previous commit
      - uses: ./.github/actions/setup

      - name: Staging is set up
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The GitHub Environment 'staging' has no CLOUDFLARE_API_TOKEN. See docs/runbook.md."
            exit 1
          fi
          npm run check:config -- --require-provisioned

      - name: Migrate the staging database
        run: |
          for attempt in 1 2 3; do
            node node_modules/wrangler/bin/wrangler.js d1 migrations apply maneman-staging --env staging --remote && exit 0
            echo "migrations: attempt $attempt failed; Cloudflare may have dropped the reply"
            sleep 15
          done
          exit 1

      - name: Check the database is staging's
        run: node scripts/mark-database.ts staging

      - name: Deploy mm-api
        run: |
          version=$(node scripts/release.ts upload --worker mm-api --env staging --tag "$SHA")
          node scripts/release.ts deploy --worker mm-api --env staging --split "$version@100" --message "staging $SHA"

      - name: Build the site (staging)
        run: npm run build:site -- --env staging
      - name: Deploy mm-site
        run: |
          version=$(node scripts/release.ts upload --worker mm-site --env staging --tag "$SHA")
          node scripts/release.ts deploy --worker mm-site --env staging --split "$version@100" --message "staging $SHA"

      - name: Build the client app (staging)
        run: npm run build:app -- --env staging
      - name: Deploy mm-app
        run: |
          version=$(node scripts/release.ts upload --worker mm-app --env staging --tag "$SHA")
          node scripts/release.ts deploy --worker mm-app --env staging --split "$version@100" --message "staging $SHA"

      # mm-ops-staging's first deploy is a bootstrap by the owner, which also attaches its route and puts it
      # on the CI token (docs/runbook.md, step 11); until then this step does nothing.
      - name: Build the ops console (staging)
        run: npm run build:ops -- --env staging
      - name: Deploy mm-ops
        run: |
          if [ -z "$(node scripts/release.ts current --worker mm-ops --env staging || true)" ]; then
            echo "::notice::mm-ops-staging is not bootstrapped yet, so it is not deployed."
            exit 0
          fi
          version=$(node scripts/release.ts upload --worker mm-ops --env staging --tag "$SHA")
          node scripts/release.ts deploy --worker mm-ops --env staging --split "$version@100" --message "staging $SHA"

      # mm-tech-staging's first deploy is a bootstrap by the owner, which also attaches its route and puts it
      # on the CI token (docs/runbook.md, step 11); until then this step does nothing.
      - name: Build the technician app (staging)
        run: npm run build:tech -- --env staging
      - name: Deploy mm-tech
        run: |
          if [ -z "$(node scripts/release.ts current --worker mm-tech --env staging || true)" ]; then
            echo "::notice::mm-tech-staging is not bootstrapped yet, so it is not deployed."
            exit 0
          fi
          version=$(node scripts/release.ts upload --worker mm-tech --env staging --tag "$SHA")
          node scripts/release.ts deploy --worker mm-tech --env staging --split "$version@100" --message "staging $SHA"

      - name: Smoke-test staging
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run smoke -- --base https://staging.maneman.in --environment staging --version-tag "$SHA"

      # app-staging, ops-staging and tech-staging: every Phase 2 surface switched on (docs/decisions/0026).
      - name: Smoke-test the Phase 2 surfaces
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npm run smoke -- --environment staging --surfaces --version-tag "$SHA"

      - name: Remind if triggers changed (CI cannot apply them)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/triggers-changed.ts --base "$BEFORE" --env staging
          fi
