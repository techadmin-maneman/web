<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mane Man client app: redesign prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16233A;--navy8:#1F2E49;--navy7:#33435F;--gold:#C9A363;--brass:#B98B45;--gold7:#8A6A2F;
  --white:#FDFDFB;--wash:#F4F0E8;--line:#D9DCE1;--grid:#E8EAED;--ink:#1F2328;--ink5:#5F6670;--slate:#6B7A93;--stone:#B4BAC3;--mist:#A9B2C1;--ph:#ECEEF1;
  --red:#A3361F;--redwash:#FBF1EE;--green:#2F6B4F;
  --r:4px;--r2:2px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans",Arial,sans-serif;color:var(--ink);background:#E3E5E9;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{font:inherit;color:inherit}
.tab-num{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:32px}
.device{width:390px;height:844px;border-radius:48px;background:#0E1420;padding:11px;box-shadow:0 30px 80px rgba(22,35,58,.28);flex:none}
.app{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--white)}
.guide{width:300px;align-self:center;font-size:14px;color:var(--ink)}
.guide h1{font-size:20px;font-weight:600;margin:0 0 4px;color:var(--navy)}
.guide p{margin:0 0 16px;color:var(--ink5)}
.demo-chip{display:none}
@media (max-width:760px){
  body{background:var(--white)}
  .stage{padding:0;display:block;height:100%}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none}
  .app{border-radius:0}
  .guide{display:none}
  .demo-chip{display:flex;position:fixed;z-index:90;right:0;top:38%;opacity:.6;width:20px;height:44px;padding:0;justify-content:center;align-items:center;gap:6px;border-top-right-radius:0!important;border-bottom-right-radius:0!important;background:rgba(22,35,58,.88);color:#fff;border-radius:var(--r);font-size:12px;font-weight:500}
  .app .top{padding-top:calc(10px + env(safe-area-inset-top))}
}

/* ---------- demo controls ---------- */
.ctl-group{margin:0 0 18px}
.ctl-label{font-weight:600;font-size:13px;color:var(--ink5);margin:0 0 6px}
.seg-v{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg-v button{padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.seg-v button:first-child{border-top:0}
.seg-v button[aria-pressed="true"]{background:var(--navy);color:#fff}
.chk{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--navy)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r2);background:#fff}

/* ---------- app structure ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--white)}
.screen.anim-in{animation:slideIn .26s cubic-bezier(.2,.8,.2,1)}
.screen.anim-back{animation:slideBack .26s cubic-bezier(.2,.8,.2,1)}
.screen.anim-fade{animation:fadeIn .2s ease}
@keyframes slideIn{from{transform:translateX(28%);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideBack{from{transform:translateX(-18%);opacity:.5}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:0 20px}
.top{display:flex;align-items:center;gap:8px;min-height:56px;padding:10px 12px 6px 20px;flex:none}
.top.sub{padding-left:6px}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1}
.top .spacer{flex:1}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r)}
.icon-btn:active{background:var(--grid)}
.title{font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.3px;margin:4px 0 4px;color:var(--navy)}
.lede{color:var(--ink5);margin:0 0 20px;font-size:15px}
.h2{font-size:20px;font-weight:600;line-height:1.3;margin:0;color:var(--navy)}
.sec{margin:28px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 4px}
.sec-h h2{font-size:15px;font-weight:600;margin:0;color:var(--ink)}
.sec-h a,.sec-h button{font-size:14px;color:var(--navy);font-weight:500}
.muted{color:var(--ink5)}
.small{font-size:14px;line-height:1.45}
.xs{font-size:13px;line-height:1.4}

/* tab bar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--white);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink5);position:relative;text-align:center}
.tabs button[aria-current="page"]{color:var(--navy);font-weight:600}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--navy)}
.tabs .badge{position:absolute;top:9px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:2px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:600;line-height:16px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:var(--r);font-weight:600;font-size:16px;width:100%;text-align:center;transition:transform .08s,background .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:disabled{background:var(--stone);color:#fff;cursor:not-allowed}
.btn-secondary{border:1px solid var(--navy);color:var(--navy);background:transparent}
.btn-ghost{color:var(--navy);height:44px}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{height:40px;font-size:14px;padding:0 14px;width:auto}
.btn-on-navy{border:1px solid rgba(255,255,255,.5);color:#fff;background:transparent}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}
.link{color:var(--navy);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.footer-cta{flex:none;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--white)}

/* lists */
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500}
.row .s{font-size:14px;color:var(--ink5)}
.row .r{text-align:right;flex:none}
.row .ic{width:24px;color:var(--navy);flex:none;display:flex}
.row.tap:active{background:var(--wash)}
.chev{color:var(--stone);flex:none;display:flex}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--ink5)}
.kv span:last-child{text-align:right}

/* tags */
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:var(--r2);font-size:12px;font-weight:600;white-space:nowrap}
.tag-ok{background:#EAF2EE;color:var(--green)}
.tag-wait{background:var(--wash);color:var(--gold7)}
.tag-neutral{background:var(--grid);color:var(--ink5)}

/* hero */
.hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:20px;margin-top:12px;position:relative;overflow:hidden}
.hero .eyebrow{font-size:13px;color:var(--mist);font-weight:500}
.hero .when{font-size:28px;font-weight:600;letter-spacing:-.3px;line-height:1.15;margin:4px 0 2px}
.hero .rel{color:var(--gold);font-weight:600;font-size:14px}
.hero .meta{display:flex;flex-direction:column;gap:8px;margin:16px 0 18px;font-size:14px;color:#E6E9EE}
.hero .meta div{display:flex;gap:10px;align-items:flex-start}
.hero .meta svg{flex:none;margin-top:2px;color:var(--mist)}
.hero hr{border:0;border-top:1px solid var(--navy7);margin:0 0 14px}
.tech{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.avatar{width:40px;height:40px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.hero .avatar{background:var(--navy7);color:#fff}
.hero-mark{position:absolute;right:-18px;top:-10px;width:120px;opacity:.07;pointer-events:none}

/* stepper (visit day) */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:16px 0 6px}
.steps div{height:3px;background:var(--navy7);border-radius:1px}
.steps div.on{background:var(--gold)}
.steps-l{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11.5px;color:var(--mist)}
.steps-l span.on{color:#fff;font-weight:600}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,163,99,.6)}100%{box-shadow:0 0 0 10px rgba(201,163,99,0)}}

/* progress */
.bar{height:6px;background:var(--grid);border-radius:1px;overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--brass)}

/* segmented */
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px;background:var(--white)}
.seg button{flex:1;height:36px;border-radius:var(--r2);font-size:14px;font-weight:500;color:var(--ink5);text-align:center}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* booking */
.stepbar{display:flex;gap:4px;padding:0 20px;margin:2px 0 14px}
.stepbar i{flex:1;height:3px;background:var(--grid);border-radius:1px}
.stepbar i.on{background:var(--navy)}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;padding:16px;border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;background:var(--white)}
.choice[aria-checked="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--stone);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
[aria-checked="true"] .radio{border-color:var(--navy)}
[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--navy)}
.choice .t{font-weight:600}
.choice .p{margin-left:auto;text-align:right;flex:none}
.dates{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 6px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:58px;height:72px;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.date .d{font-size:12px;color:var(--ink5)}
.date .n{font-size:20px;font-weight:600}
.date .a{font-size:10.5px;color:var(--ink5)}
.date[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.date[aria-pressed="true"] .d,.date[aria-pressed="true"] .a{color:var(--mist)}
.date:disabled{background:var(--grid);border-color:var(--grid);color:var(--stone);cursor:not-allowed}
.date:disabled .d,.date:disabled .a{color:var(--stone)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{height:46px;border:1px solid var(--line);border-radius:var(--r);text-align:center;font-weight:500;font-size:15px}
.slot[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.slot-h{font-size:14px;font-weight:600;margin:18px 0 8px;display:flex;justify-content:space-between}
.slot-h span{font-weight:400;color:var(--ink5)}
.suggest{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--wash);border-radius:var(--r);width:100%;margin:6px 0 0}
.hold{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink5)}
.hold b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.notice{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);font-size:14px;line-height:1.45;margin:0 0 16px}
.notice svg{flex:none;margin-top:1px}
.notice.err{background:var(--redwash);color:#6B2414}
.notice.err svg{color:var(--red)}
.notice.info{background:var(--wash);color:var(--ink)}
.timeline{position:relative;margin:14px 0 6px;height:34px}
.timeline .track{position:absolute;left:0;right:0;top:8px;height:4px;display:flex;border-radius:1px;overflow:hidden}
.timeline .track i:first-child{background:var(--slate);flex:3}
.timeline .track i:last-child{background:var(--brass);flex:1}
.timeline .lbl{position:absolute;top:18px;font-size:11.5px;color:var(--ink5);white-space:nowrap}
.pm{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line)}
.pm .logo{width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--navy);flex:none}
.pm .grow{flex:1}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.field label{font-size:14px;font-weight:500}
.input{height:52px;border:1px solid var(--stone);border-radius:var(--r);padding:0 14px;background:#fff;width:100%;font-size:16px}
.input:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy)}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:none}
.phone{display:flex;border:1px solid var(--stone);border-radius:var(--r);height:56px;background:#fff;overflow:hidden}
.phone:focus-within{outline:2px solid var(--navy);outline-offset:-1px}
.phone span{display:flex;align-items:center;padding:0 14px;border-right:1px solid var(--line);color:var(--ink5);font-size:17px}
.phone input{border:0;outline:0;flex:1;padding:0 14px;font-size:19px;letter-spacing:.5px;background:transparent}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 16px}
.otp div{height:58px;border:1px solid var(--stone);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;background:#fff}
.otp div.cur{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.otp div.err{border-color:var(--red)}
.otp input{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.check{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);margin:0 0 20px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.spinner{width:40px;height:40px;border:3px solid var(--grid);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* photos */
.ph{background:var(--ph);border-radius:var(--r2);position:relative;overflow:hidden;display:block;width:100%}
.ph svg{width:100%;height:100%;display:block}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.thumbs .ph{aspect-ratio:3/4}
.compare{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--ph);touch-action:none;user-select:none}
.compare .layer{position:absolute;inset:0}
.compare .layer svg{width:100%;height:100%}
.compare .after{clip-path:inset(0 0 0 var(--pos,50%))}
.compare .handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;background:#fff;transform:translateX(-1px);box-shadow:0 0 0 1px rgba(22,35,58,.15)}
.compare .knob{position:absolute;top:50%;left:50%;width:40px;height:40px;transform:translate(-50%,-50%);background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--navy);box-shadow:0 2px 8px rgba(22,35,58,.25)}
.compare .cap{position:absolute;bottom:10px;font-size:12px;font-weight:600;background:rgba(22,35,58,.82);color:#fff;padding:4px 8px;border-radius:var(--r2)}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.picker{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start}
.picker small{font-size:12px;color:var(--ink5)}
.picker b{font-weight:600;font-size:15px}
.angles{display:flex;gap:6px;overflow-x:auto;margin:10px 0 0;scrollbar-width:none}
.angles button{flex:none;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r2);font-size:13.5px;font-weight:500}
.angles button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.viewer{position:absolute;inset:0;z-index:60;background:#0B111C;color:#fff;display:flex;flex-direction:column;animation:fadeIn .18s}
.viewer .img{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px}
.viewer .img .ph{max-width:100%;aspect-ratio:3/4;height:auto}

/* rewards */
.reward-hero{background:var(--navy);color:#fff;border-radius:var(--r);padding:22px 20px;margin-top:12px}
.reward-hero .big{font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.3px;margin:0 0 6px}
.stat{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--navy7);margin-top:18px;padding-top:14px}
.stat b{display:block;font-size:24px;font-weight:600;color:var(--gold)}
.stat span{font-size:13px;color:var(--mist)}
.card-prev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.card-prev .img{aspect-ratio:1.91/1;background:var(--navy);display:flex;align-items:center;justify-content:center}
.card-prev .txt{padding:12px 14px;font-size:13.5px;line-height:1.4}
.how{counter-reset:h;margin:6px 0 0;padding:0;list-style:none}
.how li{display:flex;gap:14px;padding:10px 0;font-size:15px}
.how li::before{counter-increment:h;content:counter(h);font-weight:600;color:var(--navy);width:16px;flex:none}

/* toggles */
.switch{width:46px;height:28px;border-radius:14px;background:var(--stone);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--navy)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* sheets, toast, banners */
.scrim{position:absolute;inset:0;background:rgba(14,20,32,.45);z-index:40;animation:fadeIn .18s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--white);border-radius:12px 12px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-size:20px;font-weight:600;margin:0 0 6px;color:var(--navy)}
.sheet p{margin:0 0 16px;color:var(--ink5);font-size:15px}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:70;background:var(--navy);color:#fff;padding:13px 16px;border-radius:var(--r);font-size:14px;display:flex;gap:10px;align-items:center;animation:up2 .22s ease;box-shadow:0 8px 24px rgba(22,35,58,.25)}
@keyframes up2{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.toast svg{color:var(--gold);flex:none}
.offline{flex:none;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;font-size:13.5px;padding:9px 20px}
.skel{background:linear-gradient(90deg,var(--grid) 0%,#F3F4F6 50%,var(--grid) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r2)}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{padding:48px 0 24px}
.empty .ic{width:48px;height:48px;border-radius:var(--r);background:var(--wash);display:flex;align-items:center;justify-content:center;color:var(--navy);margin:0 0 16px}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--stone)}
.stars button.on{color:var(--brass)}
.done-list{list-style:none;margin:6px 0 0;padding:0}
.done-list li{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.done-list svg{color:var(--green)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

<style>
/* v2 additions */
.tier{display:flex;flex-direction:column;gap:6px;width:100%;padding:16px;border:1px solid var(--line);border-radius:var(--r);margin:0 0 10px;background:var(--white)}
.tier[aria-checked="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.tier .hd{display:flex;align-items:center;gap:12px}
.tier .nm{font-weight:600;font-size:17px;flex:1}
.tier .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.tier .facts span{font-size:12px;color:var(--ink5);display:block}
.tier .facts b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.delta{border-left:0;background:var(--wash);border-radius:var(--r);padding:14px 16px;font-size:14px;margin:4px 0 14px}
.delta b{font-weight:600}
.tl{list-style:none;margin:8px 0 0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 18px 26px}
.tl li::before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--white);border:2px solid var(--navy)}
.tl li::after{content:"";position:absolute;left:10px;top:17px;bottom:-2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.mm::before{background:var(--navy)}
.tl li.done::before{background:var(--green);border-color:var(--green)}
.tl li.pend::before{border-style:dashed;border-color:var(--brass)}
.tl .when{font-size:12.5px;color:var(--ink5)}
.tl .who{font-size:13px;font-weight:600}
.tl .txt{font-size:15px;margin-top:2px}
.seg3 button{font-size:13.5px}
.seg .cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:2px;background:var(--brass);color:var(--navy);font-size:11px;font-weight:600;margin-left:6px;text-align:center;padding:0 4px}
.seg button[aria-pressed="true"] .cnt{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.upl{display:flex;gap:8px;flex-wrap:wrap}
.upl .ph,.upl label{width:72px;height:72px;border-radius:var(--r)}
.upl label{border:1px dashed var(--stone);display:flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
/* notifications */
.nbadge{position:absolute;top:8px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:2px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:600;line-height:16px;text-align:center}
.banner{position:absolute;left:10px;right:10px;top:10px;z-index:80;background:#fff;border-radius:var(--r);box-shadow:0 10px 30px rgba(14,20,32,.22);display:flex;gap:12px;padding:12px 12px 12px 14px;align-items:flex-start;animation:down .3s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line)}
@keyframes down{from{transform:translateY(-120%)}to{transform:none}}
.banner .bi{width:34px;height:34px;border-radius:var(--r);background:var(--navy);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gold)}
.banner .bt{font-weight:600;font-size:14px}
.banner .bb{font-size:13.5px;color:var(--ink5)}
.nrow{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;align-items:flex-start}
.nrow .ni{width:36px;height:36px;border-radius:var(--r);background:var(--wash);display:flex;align-items:center;justify-content:center;color:var(--navy);flex:none}
.nrow .nt{font-weight:600;font-size:15px}
.nrow .nb{font-size:14px;color:var(--ink5)}
.nrow .nw{font-size:12px;color:var(--ink5);margin-top:2px}
.nrow.unread .nt::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brass);margin-left:8px;vertical-align:middle}
.track5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:16px 0 6px}
.track5 div{height:3px;background:var(--navy7);border-radius:1px}.track5 div.on{background:var(--gold)}
.lbl5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10.5px;color:var(--mist)}.lbl5 span.on{color:#fff;font-weight:600}
.msg{background:var(--navy8);border-radius:var(--r);padding:10px 12px;font-size:13.5px;color:#E6E9EE;margin:12px 0 0}
.msg b{color:#fff;font-weight:600}
.jr{list-style:none;margin:12px 0 0;padding:0}
.jr li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--navy7);font-size:14px;color:#E6E9EE;align-items:center}
.jr li .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mist);display:flex;align-items:center;justify-content:center;flex:none;color:var(--navy)}
.jr li.ok .dot{background:var(--gold);border-color:var(--gold)}
.jr li.now{color:#fff;font-weight:600}.jr li.now .dot{border-color:var(--gold)}
/* toasts: the technician app's (design/tech-redesign): ink, white words, a white tick, the width of the screen */
.toast{left:12px!important;right:12px!important;bottom:84px!important;background:#1F2328!important;color:#fff!important;border-radius:4px!important;padding:14px 16px!important;font-size:15px!important;line-height:1.4;gap:10px!important;box-shadow:none!important;animation:mmFade .16s ease-out!important}
.toast svg{color:#fff!important}
.app.no-tabs .toast{bottom:96px!important}
@keyframes mmFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.slot.taken{color:var(--stone);background:var(--white);text-decoration:line-through;cursor:not-allowed;border-color:var(--grid)}
.push{position:absolute;left:8px;right:8px;top:4px;z-index:80;padding:14px 16px 6px;border-radius:22px;background:#fff;box-shadow:0 6px 24px rgba(11,15,22,.22);animation:down .26s ease-out}
.push .ph1{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink5)}
.push .ph1 i{width:18px;height:18px;border-radius:5px;background:var(--navy);display:inline-block}
.push .pt{font-weight:600;font-size:15px;margin-top:6px}
.push .pb{font-size:14px;color:var(--ink);margin-top:2px}
.push .pa{display:flex;gap:4px;justify-content:flex-end;margin-top:2px}
.push .pa button{height:40px;padding:0 8px;font-size:14px;font-weight:600;color:var(--navy)}
.signoff{background:#fff;color:var(--ink);border-radius:var(--r);padding:16px;margin-top:14px}
.signoff h3{font-size:17px;font-weight:600;margin:0 0 4px;color:var(--navy)}
.ck{display:flex;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.ck .bx{width:22px;height:22px;border:1.5px solid var(--stone);border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.ck[aria-checked="true"] .bx{background:var(--navy);border-color:var(--navy)}
/* razorpay simulated checkout */
.rzp{position:absolute;left:0;right:0;bottom:0;z-index:52;background:#fff;border-radius:12px 12px 0 0;max-height:86%;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(14,20,32,.25)}
.rzp-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.rzp-h .m{width:36px;height:36px;border-radius:var(--r);background:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.rzp-b{overflow-y:auto;padding:6px 16px 8px}
.rzp-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12px;color:var(--ink5);display:flex;justify-content:space-between}
.rzp .grp{font-size:13px;font-weight:600;color:var(--ink5);margin:14px 0 4px}
.sim{position:absolute;top:10px;right:56px;font-size:10.5px;font-weight:600;color:var(--gold7);background:var(--wash);padding:2px 6px;border-radius:2px}

:root{--r:0;--r2:0}

 return `<nav class="tabs" aria-label="Main">${t.map(([k,l,i])=>`<button data-a="tab" data-v="${k}" ${active===k?'aria-current="page"':''}>${I(i,22,active===k?1.9:1.6)}${l}${k==='rewards'&&S.credits?`<span class="badge">${S.credits}</span>`:''}${k==='visits'&&openIssues()?`<span class="badge">${openIssues()}</span>`:''}</button>`).join('')}</nav>`;
};
const row=(o)=>`<button class="row tap" ${o.a?`data-a="${o.a}"`:''} ${o.v!==undefined?`data-v="${o.v}"`:''} ${o.p!==undefined?`data-p="${o.p}"`:''}>${o.ic?`<span class="ic">${I(o.ic)}</span>`:''}${o.lead||''}<span class="grow"><span class="t" style="display:block">${o.t}</span>${o.s?`<span class="s" style="display:block">${o.s}</span>`:''}</span>${o.r?`<span class="r">${o.r}</span>`:''}${o.noChev?'':`<span class="chev">${I('right',18)}</span>`}</button>`;
const kv=(k,v)=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`;
const avatarBtn=`<button class="icon-btn" data-a="go" data-v="profile" aria-label="Profile and settings"><span class="avatar" style="background:var(--wash);color:var(--navy);width:36px;height:36px">RM</span></button>`;
const statusTag=s=>s==='resolved'?'<span class="tag tag-ok">Resolved</span>':s==='progress'?'<span class="tag tag-wait">In progress</span>':'<span class="tag tag-wait">Open</span>';
const upLabel=u=>u.kind==='firstfit'?`First fit · ${TIERS[u.tier].name}`:u.kind==='consult'?'Home consultation':u.kind==='replacement'?`Replacement · ${TIERS[u.tier].name}`:'Service visit';

/* ---------------- screens ---------------- */
const SCREENS={};

SCREENS.signin=()=>`
 <div class="scroll"><div class="pad" style="padding-top:64px">
  ${lockup('#16233A',150)}
  <h1 class="title" style="margin-top:40px">Sign in</h1>
  <p class="lede">Use the mobile number you booked with. We'll send a 6-digit code on WhatsApp.</p>
  <label for="ph" class="small" style="font-weight:500;display:block;margin:0 0 6px">Mobile number</label>
  <div class="phone"><span>+91</span><input id="ph" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="98000 44417" value="${S.phone}" data-in="phone"></div>
  <p class="xs muted" style="margin:10px 0 0">Demo: any 10 digits work. Numbers starting with 7 have no booking.</p>
 </div></div>
 <div class="footer-cta">
  <button class="btn btn-primary" data-a="sendCode" ${S.phone.length===10?'':'disabled'}>Send code on WhatsApp</button>
  <p class="small muted" style="text-align:center;margin:12px 0 0">New to Mane Man? <button class="link" data-a="toast" data-v="Opens the free consultation booking on maneman.in">Book a free consultation</button></p>
 </div>`;

SCREENS.otp=()=>{
 const cells=[...Array(6)].map((_,i)=>`<div class="${S.otpErr?'err':i===S.otp.length?'cur':''}">${S.otp[i]||''}</div>`).join('');
 return `${topBar('',{back:1})}
 <div class="scroll"><div class="pad">
  <h1 class="title">Enter the code</h1>
  <p class="lede">Sent on WhatsApp to +91 ${S.phone.slice(0,5)} ${S.phone.slice(5)}. <button class="link" data-a="back">Change</button></p>
  <div class="otp">${cells}<input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="${S.otp}" data-in="otp" aria-label="6-digit code"></div>
  ${S.otpErr?`<p class="small" style="color:var(--red);margin:-6px 0 12px">That code doesn't match. Check the latest message and try again.</p>`:''}
  <p class="small muted" style="margin:0">The code fills in by itself when it arrives. Demo: any 6 digits; 000000 shows the error.</p>
  <div style="margin-top:24px;display:flex;flex-direction:column;gap:4px;align-items:flex-start">
   <button class="btn-ghost small" style="font-weight:500" data-a="toast" data-v="Code sent by SMS">Send by SMS instead</button>
   <span class="small muted" id="resend">${S.resend>0?`Resend on WhatsApp in 0:${String(S.resend).padStart(2,'0')}`:''}</span>
   ${S.resend<=0?`<button class="btn-ghost small" style="font-weight:500" data-a="resend">Resend on WhatsApp</button>`:''}
  </div>
 </div></div>`;
};

SCREENS.notfound=()=>`${topBar('',{back:1})}
 <div class="scroll"><div class="pad">
  <h1 class="title">No booking on +91 ${S.phone.slice(0,5)} ${S.phone.slice(5)}</h1>
  <p class="lede">The app opens once you've booked a home consultation. If you booked with another number, sign in with that one.</p>
  <div class="list">${row({ic:'refresh',t:'Try another number',a:'back'})}${row({ic:'chat',t:'Message us on WhatsApp',s:'We link your booking to this number',a:'toast',v:'Opens WhatsApp with Mane Man'})}</div>
 </div></div>
 <div class="footer-cta"><button class="btn btn-primary" data-a="toast" data-v="Opens the free consultation booking on maneman.in">Book a free consultation</button></div>`;

const heroMark=`<div class="hero-mark">${mark('#C9A363',120)}</div>`;
const techRow=u=>u.tech?`<hr><div class="tech"><span class="avatar">${u.ini}</span><div><div style="font-weight:600">${u.tech}</div><div style="font-size:13px;color:var(--mist)">Your technician for this visit</div></div></div>`:'';
function heroUpcoming(u){
 const p=curPiece();
 if(!u&&replacementOpen()){
  const end=pieceEnd(p);
  return `<div class="hero">${heroMark}<div class="eyebrow">Replacement due</div><div class="when" style="font-size:24px">Your ${TIERS[p.tier].name} hair system is due on ${dDM(end)}</div><div class="rel">${daysTo(end)} days left</div>
   <p style="color:#E6E9EE;font-size:14px;margin:12px 0 18px">Book your replacement. Keep ${TIERS[p.tier].name}, or change to another hair system now; a different one has to be ordered for you.</p>
   <button class="btn btn-gold" data-a="bookRepl">Book your replacement</button></div>`;
 }
 if(!u) return `<div class="hero">${heroMark}<div class="eyebrow">Next visit</div><div class="when" style="font-size:22px">Nothing booked</div><p style="color:#E6E9EE;font-size:14px;margin:6px 0 18px">Your last service was on ${dDM(PAST()[0].date)}. A service ${TIERS[p.tier].svcPer} keeps the bond and the hairline right.</p><button class="btn btn-gold" data-a="book">Book a service visit</button></div>`;
 if(u.live) return liveHero(u);
 const consult=u.kind==='consult';
 return `<div class="hero">${heroMark}
  <div class="eyebrow">${consult?'Your home consultation':u.kind==='replacement'?'Your replacement':u.kind==='firstfit'?'Your first fit':'Next visit'}</div>
  <div class="when">${fd(u.date,{weekday:'long',day:1,month:'short'})}</div>
  <div class="rel">${rel(u.date)}</div>
  <div class="meta">
   <div>${I('clock',16)}<span>${consult?'Morning, 9 am to 12 noon<br><span style="color:var(--mist)">We confirm the exact hour on WhatsApp the day before</span>':`Arrives ${tmR(u.start)}${u.kind==='service'?' · about 90 minutes':u.kind==='firstfit'?' · about 3 hours':''}`}</span></div>
   ${u.kind==='firstfit'?`<div>${I('layers',16)}<span>Mane Man ${TIERS[u.tier].name}, in your colour</span></div>`:''}
   ${u.kind==='replacement'?`<div>${I('layers',16)}<span>New ${TIERS[u.tier].name} hair system${u.tier!==curPiece().tier?` (changing from ${TIERS[curPiece().tier].name})`:''}</span></div>`:''}
   <div>${I('pin',16)}<span>${ADDRESS.l1}, ${ADDRESS.l2}</span></div>
   <div>${I('receipt',16)}<span>${consult?'Free':u.kind==='firstfit'?'Hair system paid; fitting included':u.price?`${rs(u.price)} paid`:'Free service visit'}</span></div>
  </div>
  ${techRow(u)}
  <div class="btn-row"><button class="btn btn-on-navy btn-sm" style="height:44px" data-a="manage">Change</button><button class="btn btn-on-navy btn-sm" style="height:44px" data-a="note">Add a note</button></div>
 </div>`;
}

function pieceBlock(){
 const p=curPiece(),T=TIERS[p.tier],m=pieceMonth(p),end=pieceEnd(p),open=replacementOpen();
 return `<section class="sec"><div class="sec-h"><h2>Your hair system</h2><button data-a="go" data-v="piece">History</button></div>
  <div style="border-top:1px solid var(--line);padding-top:14px">
   <div style="display:flex;justify-content:space-between;font-size:15px"><b style="font-weight:600">Mane Man ${T.name}</b><span class="muted tab-num">Month ${m} of ${T.life}</span></div>
   <div class="bar" role="progressbar" aria-valuenow="${m}" aria-valuemin="0" aria-valuemax="${T.life}" aria-label="Hair system age"><i style="width:${m/T.life*100}%"></i></div>
   <div class="small muted">${S.pendingPiece?`Replacement booked for ${dDM(S.pendingPiece.date)}: ${TIERS[S.pendingPiece.tier].name}.`:open?`Ends ${dDM(end)}. You can book its replacement now.`:`Fitted ${dFull(p.from)}. You can book its replacement from ${dDM(windowOpens(p))}, and pick a different hair system then if you want one.`}</div>
  </div></section>`;
}

SCREENS.home=()=>{
 const hdr=`<div class="top"><span style="display:flex">${mark('#16233A',30)}</span><span class="spacer"></span>${bellBtn()}${avatarBtn}</div>`;
 if(S.homeLoading) return `${hdr}<div class="scroll"><div class="pad"><div class="skel" style="height:30px;width:60%;margin:6px 0 16px"></div><div class="skel" style="height:290px"></div><div class="skel" style="height:18px;width:40%;margin:28px 0 12px"></div><div class="skel" style="height:56px;margin:0 0 8px"></div><div class="skel" style="height:56px"></div></div></div>${tabbar('home')}`;
 if(S.homeError) return `${hdr}<div class="scroll"><div class="pad"><div class="empty"><div class="ic">${I('alert')}</div><h1 class="h2">We couldn't load your account</h1><p class="lede" style="margin-top:6px">Your bookings are safe. Nothing has changed on our side.</p><div class="btn-row"><button class="btn btn-primary" data-a="retryHome">Try again</button><button class="btn btn-secondary" data-a="toast" data-v="Opening WhatsApp">Message us</button></div></div></div></div>${tabbar('home')}`;
 const greet=TODAY.getHours()<12?'Good morning':TODAY.getHours()<17?'Good afternoon':'Good evening';
 let body=`<h1 class="title" style="margin-top:0">${greet}, Rohit</h1>${heroUpcoming(S.upcoming)}`;
 if(['consulted','custom'].includes(S.scenario)&&!S.upcoming){body=`<h1 class="title" style="margin-top:0">${greet}, Rohit</h1>${ffHero()}`;}
 if(['consulted','custom','livefit'].includes(S.scenario)){body+=`<section class="sec"><div class="list">${row({ic:'layers',t:'Compare the four hair systems',s:'Want a different one? Message us before you pay',a:'go',v:'compare'})}${row({ic:'help',t:'Questions about your fitting?',s:'We reply within an hour, 9 am to 9 pm',a:'toast',v:'Opens WhatsApp with Mane Man'})}</div></section>`;}
 else if(isLead()){
  body+=`<section class="sec"><div class="sec-h"><h2>What happens at the consultation</h2></div>
   <ol class="how"><li>Before photos, then your scalp and hairline are mapped.</li><li>Your colour and style are matched, and the technician shows the hair systems that suit you.</li><li>If you go ahead, you pay through Razorpay, in the app or by the link we text you. If your hair system is in the technician's kit, you can be fitted the same day; if not, we book your first fit.</li></ol></section>
   <section class="sec"><div class="list">${row({ic:'layers',t:'Compare the four hair systems',s:'Essential, Active, Natural, Celebrity',a:'go',v:'compare'})}${row({ic:'cam',t:'Try on a look',s:'See a style on your own photo before the visit',a:'toast',v:'Opens the try-on on maneman.in'})}${row({ic:'help',t:'Questions before the visit?',s:'We reply within an hour, 9 am to 9 pm',a:'toast',v:'Opens WhatsApp with Mane Man'})}</div></section>`;
 } else {
  const oi=ISSUES.find(i=>i.status!=='resolved');
  const last=PHOTOV()[0];
  body+=`${pieceBlock()}
   <section class="sec"><div class="list">
    ${oi?row({ic:'flag',t:oi.title,s:`${oi.id} · ${oi.status==='progress'?'In progress':'Open'}`,a:'go',v:'issue',p:oi.id}):''}
    ${S.credits?row({lead:`<span class="avatar" style="background:var(--wash);color:var(--gold7);width:40px;height:40px">${S.credits}</span>`,t:`${S.credits} free service visits`,s:'Use by 3 Jan 2028. Applied when you book.',a:'tab',v:'rewards'}):''}
    ${S.upcoming?'':row({ic:'plus',t:'Book a service visit',s:`${rs(svcPrice())} · about 90 minutes`,a:'book'})}
    ${row({ic:'wrench',t:'Report an issue',s:'Lifting edges, itching, colour, billing',a:'raise'})}
    ${row({ic:'gift',t:'Invite a friend',s:'You both get 3 free service visits when they are fitted',a:'tab',v:'rewards'})}
   </div></section>
   <section class="sec" style="margin-bottom:28px"><div class="sec-h"><h2>Last visit</h2><button data-a="tab" data-v="visits">All visits</button></div>
    <div class="list">${row({lead:`<span style="width:44px;flex:none">${ph('front',last.stage,'Front photo')}</span>`,t:dDM(last.date)+' · '+last.type,s:last.tech+' · 5 photos',a:'go',v:'visit',p:last.id})}</div></section>`;
 }
 return `${hdr}${offlineBar()}<div class="scroll"><div class="pad">${body}<div style="height:24px"></div></div></div>${tabbar('home')}`;
};

SCREENS.visits=()=>{
 const u=S.upcoming;
 const up=S.requested&&!u?`<div class="list"><div class="row"><span class="ic">${I('clock')}</span><span class="grow"><span class="t" style="display:block">Requested: ${dShort(S.requested.date)}, ${S.requested.win}</span><span class="s">Waiting for us to confirm on WhatsApp</span></span><span class="tag tag-wait">Requested</span></div></div>`:u?`<div class="list">${row({lead:`<span class="avatar" style="background:var(--navy);color:#fff;flex-direction:column;width:52px;height:56px;line-height:1.1"><span style="font-size:11px;color:var(--mist);font-weight:500">${fd(u.date,{month:'short'})}</span><span style="font-size:20px">${u.date.getDate()}</span></span>`,t:upLabel(u),s:`${fd(u.date,{weekday:'long'})} · ${u.kind==='consult'?'9 am to 12 noon':tmR(u.start)}${u.tech?' · '+u.tech.split(' ')[0]:''}`,r:u.kind==='consult'?'<span class="tag tag-neutral">Free</span>':'<span class="tag tag-ok">Paid</span>',a:'manage'})}</div>`
  :`<div class="empty" style="padding-top:28px"><div class="ic">${I('cal')}</div><h2 class="h2">Nothing booked</h2><p class="lede" style="margin-top:6px">${replacementOpen()?'Your replacement is due. Book it from Home.':'Book your next service when it suits you. A technician comes to you.'}</p></div>`;
 const past=isLead()?`<div class="empty" style="padding-top:28px"><div class="ic">${I('clock')}</div><h2 class="h2">No visits yet</h2><p class="lede" style="margin-top:6px">After your consultation, every visit shows here with its photos and invoice.</p></div>`
  :`<div class="list">${PAST().map(v=>row({lead:`<span style="width:44px;flex:none">${ph('front',v.stage,'Front photo')}</span>`,t:dFull(v.date),s:v.outcome==='noshow'?`<span style="color:var(--red)">Missed visit</span>`:`${v.type}${v.tier?' · '+TIERS[v.tier].name:''} · ${v.tech.split(' ')[0]}`,r:`<span class="small tab-num">${rs(v.paid)}</span>`,a:'go',v:'visit',p:v.id})).join('')}</div>`;
 const iss=ISSUES.length?`<div class="list">${ISSUES.map(i=>row({t:i.title,s:`${i.id} · raised ${dDM(i.raised)}`,r:statusTag(i.status),a:'go',v:'issue',p:i.id})).join('')}</div><p class="xs muted" style="margin:10px 0 0">Every issue you raise stays here with our replies and what was done.</p>`
  :`<div class="empty" style="padding-top:28px"><div class="ic">${I('flag')}</div><h2 class="h2">No issues raised</h2><p class="lede" style="margin-top:6px">If something is off with your hair system, a visit or a payment, raise it here and track it to the end.</p></div>`;
 const seg=S.visitsSeg;
 const cta=seg==='issues'?`<button class="btn btn-primary" data-a="raise">${I('plus',20,2)}Report an issue</button>`:isLead()||u?'':`<button class="btn btn-primary" data-a="book">${I('plus',20,2)}Book a service visit</button>`;
 return `<div class="top"><h1 style="font-size:28px;color:var(--navy)">Visits</h1>${bellBtn()}${avatarBtn}</div>${offlineBar()}
 <div class="pad" style="flex:none;padding-bottom:10px"><div class="seg seg3" role="group" aria-label="Show"><button data-a="seg" data-v="upcoming" aria-pressed="${seg==='upcoming'}">Upcoming</button><button data-a="seg" data-v="past" aria-pressed="${seg==='past'}">Past</button><button data-a="seg" data-v="issues" aria-pressed="${seg==='issues'}">Issues${openIssues()?`<span class="cnt">${openIssues()}</span>`:''}</button></div></div>
 <div class="scroll"><div class="pad">${seg==='upcoming'?up:seg==='past'?past:iss}</div></div>
 ${cta?`<div class="footer-cta" style="border-top:0;padding-bottom:12px">${cta}</div>`:''}
 ${tabbar('visits')}`;
};

SCREENS.visit=(p)=>{
 const v=ALLPAST.find(x=>x.id===p.p)||PAST()[0];
 if(v.outcome==='noshow') return missedVisit(v);
 const r=S.ratings[v.id]||0, vi=PHOTOV().indexOf(v);
 const linked=ISSUES.filter(i=>i.visit===v.id);
 return `${topBar(dFull(v.date),{back:1})}<div class="scroll"><div class="pad">
  <div class="small muted">${v.type}${v.tier?` · ${TIERS[v.tier].name}${v.from?` (changed from ${TIERS[v.from].name})`:''}`:''}</div>
  <div class="thumbs" style="margin:12px 0 6px">${ANGLES.map(([k,l],i)=>`<button data-a="viewer" data-v="${vi}" data-p="${i}" aria-label="${l} photo">${ph(k,v.stage,l)}</button>`).join('')}</div>
  <p class="xs muted" style="margin:0 0 18px">${I('lock',13)} Only you and your technician see these photos.</p>
  ${v.signed?kv('Signed off',`By you, ${tStamp(v.signed)}`)+(v.firstfit?kv('Fit guarantee',`Until ${dDM(addDays(v.date,OPS.rules.guarantee_days))} · <button class="link" data-a="raise" data-v="${v.id}">The fit isn't right</button>`):''):''}${kv('Technician',v.tech)}${kv('Time taken',v.dur)}${kv('Paid',`${rs(v.paid)} · <button class="link" data-a="go" data-v="payment" data-p="${v.id}">Invoice</button>`)}
  <section class="sec" style="margin-top:22px"><div class="sec-h"><h2>What was done</h2></div><ul class="done-list">${v.done.map(d=>`<li>${I('check',18,2)}${d}</li>`).join('')}</ul></section>
  ${linked.length?`<section class="sec"><div class="sec-h"><h2>Issues linked to this visit</h2></div><div class="list">${linked.map(i=>row({t:i.title,s:i.id,r:statusTag(i.status),a:'go',v:'issue',p:i.id})).join('')}</div></section>`:''}
  <section class="sec"><div class="sec-h"><h2>How was this visit?</h2></div>
   <div class="stars" role="radiogroup" aria-label="Rate this visit">${[1,2,3,4,5].map(n=>`<button class="${n<=r?'on':''}" data-a="rate" data-v="${v.id}" data-p="${n}" aria-label="${n} of 5"><svg width="28" height="28" viewBox="0 0 24 24" fill="${n<=r?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">${P.star}</svg></button>`).join('')}</div>
   ${r?`<p class="small muted" style="margin:6px 0 0">${r<4?'Thanks. Tell us what went wrong and we will follow up. <button class="link" data-a="raise" data-v="'+v.id+'">Report an issue</button>':'Thanks. We share ratings with the technician.'}</p>`:''}</section>
  <div style="margin:22px 0 30px"><button class="link small" data-a="raise" data-v="${v.id}">Report an issue with this visit</button></div>
 </div></div>`;
};

/* ---------- issues ---------- */
SCREENS.issue=(p)=>{
 const i=ISSUES.find(x=>x.id===p.p); if(!i) return '';
 const vis=i.visit?ALLPAST.find(v=>v.id===i.visit)||null:null;
 const ev=i.events.map(e=>`<li class="${e.who==='mm'?'mm':e.who==='done'?'done':''}"><div class="when">${tStamp(e.t)}</div><div class="who">${e.who==='you'?'You':e.who==='done'?'Resolved':e.name}</div><div class="txt">${e.txt}</div>${e.photos?`<div class="upl" style="margin-top:8px">${[...Array(e.photos)].map(()=>ph('front',9,'Photo you attached')).join('')}</div>`:''}</li>`).join('');
 return `${topBar(i.id,{back:1})}<div class="scroll"><div class="pad">
  ${statusTag(i.status)}
  <h1 class="h2" style="font-size:22px;margin:10px 0 4px">${i.title}</h1>
  <div class="small muted">${i.cat} · raised ${tStamp(i.raised)}</div>
  ${vis?`<div style="margin-top:14px" class="list">${row({ic:'cal',t:`Linked visit: ${dFull(vis.date)}`,s:vis.type,a:'go',v:'visit',p:vis.id})}</div>`:''}
  <section class="sec"><div class="sec-h"><h2>Log</h2></div><ol class="tl">${ev}${i.status!=='resolved'?`<li class="pend"><div class="who" style="color:var(--gold7)">Waiting on Mane Man</div><div class="txt small muted">We reply within an hour, 9 am to 9 pm.</div></li>`:''}</ol></section>
  ${i.status==='resolved'?`<div class="notice info" style="margin-top:6px">${I('check',18,2)}<span>Resolved. If it comes back within 14 days, reopen it and the history stays together.</span></div><button class="btn btn-secondary" style="margin-bottom:28px" data-a="reopen" data-v="${i.id}">It's happening again</button>`:
  `<div class="field" style="margin-top:6px"><label for="upd">Add an update</label><textarea class="input" id="upd" placeholder="Anything new since you raised this"></textarea></div><div class="btn-row" style="margin-bottom:28px"><button class="btn btn-primary" data-a="addUpdate" data-v="${i.id}">Send update</button><button class="btn btn-secondary" data-a="resolveMine" data-v="${i.id}">It's sorted</button></div>`}
 </div></div>`;
};

SCREENS.raise=()=>{
 const r=S.raise;
 const visits=PAST().slice(0,4);
 return `${topBar('Report an issue',{back:1})}<div class="scroll"><div class="pad">
  <h2 class="h2" style="margin:0 0 12px">What's it about?</h2>
  <div class="chips" role="group" aria-label="Issue type">${ISSUE_CATS.map((c,k)=>`<button class="chip" data-a="rcat" data-v="${k}" aria-pressed="${r.cat===k}">${c}</button>`).join('')}</div>
  <div class="field" style="margin-top:22px"><label for="rdesc">What's happening?</label><textarea class="input" id="rdesc" data-in="rdesc" placeholder="When it started and what you notice">${r.desc}</textarea></div>
  <div class="field"><label>Photos <span class="muted" style="font-weight:400">(optional, helps us a lot)</span></label>

/* ---------- booking flow ---------- */
// kinds: service | replacement | reschedule
function newBooking(kind){
 const rs_=kind==='reschedule';
 const u=S.upcoming;
 S.bk={kind, origKind:rs_&&u?u.kind:kind, step:kind==='replacement'?'piece':'when', tier:kind==='firstfit'?S.ff.tier:curPiece().tier, useCredit:S.credits>0&&kind==='service', day:null, slot:null, note:'', code:false, err:null, holdEnd:null, failed:false};
 if(rs_&&u&&u.kind==='replacement') S.bk.tier=u.tier;
 go('book');
}
const bkLen=()=>S.bk.origKind==='replacement'?28:14;
const minDay=()=>{const b=S.bk;if(b.origKind==='replacement'&&b.tier!==curPiece().tier&&TODAY>orderBy(curPiece()))return MAKE_DAYS()-1;return 0};
function dayList(){const n=bkLen(),mn=minDay();return [...Array(n)].map((_,i)=>{const d=addDays(TODAY,i+1);return {d,i,full:i%6===4,early:i<mn}})}
function allSlots(i){const out=[],st=OPS.rules.booking_rules.step;for(let m=540;m<=1110;m+=st){const h=(i*7+Math.round(m/30)*3)%5;out.push({m,open:h!==0&&h!==3&&!(i===2&&m<720)})}return out}
function slotsFor(i){return allSlots(i).filter(o=>o.open).map(o=>o.m)}
function earliest(){for(const x of dayList()){if(!x.full&&!x.early){const s=slotsFor(x.i);if(s.length)return {i:x.i,m:s[0],d:x.d}}}}
function bkPrice(){const b=S.bk;
 if(b.kind==='reschedule') return S.late&&b.origKind!=='consult'?(S.upcoming.price||svcPrice()):0;
 if(b.kind==='replacement') return TIERS[b.tier].piece;
 if(b.kind==='firstfit') return S.ff&&S.ff.custom?TIERS[b.tier].svc:TIERS[b.tier].ff;
 return b.useCredit?0:svcPrice();}
const holdLeft=()=>Math.max(0,Math.round((S.bk.holdEnd-Date.now())/1000));
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

SCREENS.book=()=>{
 const b=S.bk; if(!b) return '';
 const steps=b.kind==='replacement'?['piece','when','review']:b.kind==='reschedule'?['when','review']:['when','review'];
 const si=steps.indexOf(b.step);
 const bar=si>=0?`<div class="stepbar" aria-hidden="true">${steps.map((s,i)=>`<i class="${i<=si?'on':''}"></i>`).join('')}</div>`:'';
 const close=`<button class="icon-btn" data-a="closeBook" aria-label="Close">${I('x')}</button>`;
 const head=(t,backable)=>`<div class="top ${backable?'sub':''}">${backable?`<button class="icon-btn" data-a="bkBack" aria-label="Back">${I('left')}</button>`:''}<h1>${t}</h1>${close}</div>`;
 const cp=curPiece();
 if(b.step==='verifying'||b.step==='pending') return `<div class="scroll" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px"><div class="spinner"></div>
  <h1 class="h2" style="margin:24px 0 6px">${b.step==='verifying'?'Confirming your payment':'Waiting for your bank'}</h1>
  <p class="small muted" style="max-width:300px">${b.step==='verifying'?'This takes a few seconds.':'Razorpay has your payment and your bank is confirming it. Your time stays held. We will message you on WhatsApp the moment it clears, so you can close the app.'}</p></div>`;
 if(b.step==='done'){
  const u=S.upcoming;

 }
 // review
 const price=bkPrice(), d=addDays(TODAY,b.day+1), left=holdLeft(), deadline=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,b.slot-OPS.rules.change_notice_hours*60);

 const payBtn=price>0?`Pay ${rs(price)}`:b.kind==='reschedule'?'Confirm new time':'Confirm free visit';
 const priceRows=b.kind==='reschedule'?kv('Payment',price?`${rs(price)} new charge`:'Already paid, carries over')
  :b.kind==='service'?(S.credits>0?`<div class="row" style="min-height:56px"><span class="grow"><span class="t" style="display:block">Use a free service visit</span><span class="s">${S.credits} left · use by 3 Jan 2028</span></span><button class="switch" role="switch" aria-checked="${b.useCredit}" aria-label="Use a free service visit" data-a="useCredit"></button></div>`:'')+kv('Total, incl. GST',b.useCredit?`<s class="muted">${rs(svcPrice())}</s> <b style="font-weight:600">Free</b>`:`<b class="tab-num" style="font-weight:600">${rs(price)}</b>`)
  :b.kind==='firstfit'?(S.ff&&S.ff.custom?kv('Hair system','Paid when ordered')+kv('Fitting, incl. GST',`<b class="tab-num" style="font-weight:600">${rs(price)}</b>`):kv('First fit, incl. GST',`<b class="tab-num" style="font-weight:600">${rs(price)}</b>`)+`<div class="xs muted" style="padding:6px 0">${TIERS[b.tier].name} hair system ${rs(TIERS[b.tier].hs)} and its fitting</div>`):kv('Total, incl. GST',`<b class="tab-num" style="font-weight:600">${rs(price)}</b>`);
 return `${head('Review',true)}${bar}<div class="scroll"><div class="pad">

  <div style="border-top:1px solid var(--line)">

  <div class="field" style="margin-top:18px"><label for="note">Note for the technician <span class="muted" style="font-weight:400">(optional)</span></label><textarea class="input" id="note" data-in="note" placeholder="For example: the back feels loose since Tuesday">${b.note}</textarea></div>
  ${price>0?`<div class="small muted" style="display:flex;gap:10px;align-items:flex-start;margin:0 0 6px">${I('lock',16)}<span>Pay by UPI, card, netbanking or wallet on Razorpay's secure checkout. Saved methods appear there.</span></div>
   ${b.code?`<div class="field" style="margin-top:14px"><label for="code">Discount code</label><div class="btn-row"><input class="input" id="code" style="flex:2" placeholder="Enter code"><button class="btn btn-secondary" style="height:52px" data-a="toast" data-v="That code isn't valid for this visit">Apply</button></div></div>`:`<button class="link small" style="margin:8px 0 0;display:inline-block" data-a="code">Have a discount code?</button>`}`:''}
  <section class="sec"><div class="sec-h"><h2>Changing your plans</h2></div>
   <div class="timeline" aria-hidden="true"><div class="track"><i></i><i></i></div><span class="lbl" style="left:0">Now</span><span class="lbl" style="left:75%;transform:translateX(-50%)">${dShort(deadline)}, ${tm(b.slot)}</span><span class="lbl" style="right:0">Visit</span></div>
   <p class="small muted" style="margin:6px 0 0">${lateLine(b,deadline)}</p></section>
  <p class="xs muted" style="margin:20px 0 24px">By continuing you agree to the <button class="link">Terms</button> and <button class="link">Privacy Policy</button>. The technician photographs five angles at every visit, for your record.</p>
 </div></div><div class="footer-cta"><button class="btn btn-primary" data-a="pay" ${S.offline?'disabled':''}>${S.offline?'You are offline':payBtn}</button></div>`;
};

 if(g==='ops'){const [p,k]=v.split('.');const val=+t.value;if(!(val>=0))return;if(p==='pkg')OPS.packages.active[k]=val;else if(p==='gst')OPS.gst_percent=val;else if(p==='hold')OPS.rules.payment_hold.countdown=val;else if(p==='notice')OPS.rules.change_notice_hours=val;else if(p==='guar')OPS.rules.guarantee_days=val;recalcTiers();render(true);return}
 if(g==='live'){if(!['live','livefit'].includes(S.scenario))setScenario(v==='signoff'?'livefit':'live');S.stack=[{s:'home'}];liveEvent(v);closeDemo();return}
 if(g==='pay'){S.payOutcome=v;if(S.bk)S.bk.failed=false;render(true)}
 if(g==='flag'){S[v]=t.checked;if(v==='homeError'&&S.scenario==='signedout')setScenario('fitted');render(true)}
 if(g==='loading'){if(S.scenario==='signedout')setScenario('fitted');S.stack=[{s:'home'}];S.homeLoading=true;render();setTimeout(()=>{S.homeLoading=false;render(true)},1200);closeDemo()}
 if(g==='jump'){
  if(S.scenario==='signedout'||(v==='repl'&&S.scenario!=='due'))setScenario(v==='repl'?'due':'fitted');
  if(v==='book'&&S.upcoming&&S.scenario!=='due'){S.upcoming=null}
  S.sheet=null;S.viewer=null;S.rzp=null;
  if(v==='book'){S.stack=[{s:'home'}];newBooking('service')}

}
