<script>// minimal stand-in for the canvas runtime, preview only
window.DCLogic = class { constructor(props){ this.props = props||{}; this.state = {}; }
  setState(p){ this.state = Object.assign({}, this.state, typeof p==='function'?p(this.state):p); window.__rerender(); } forceUpdate(){ window.__rerender(); } };
function look(path, scope){ path=path.trim(); if(path==='true')return true; if(path==='false')return false; if(/^-?\d+(\.\d+)?$/.test(path))return +path;
  const parts=path.split('.'); let v; for(const sc of scope){ if(sc && parts[0] in sc){ v=sc[parts[0]]; break; } }
  for(let i=1;i<parts.length;i++){ if(v==null)return undefined; v=v[parts[i]]; } return v; }
function interp(s, scope){ const m=s.match(/^\s*\{\{([^}]+)\}\}\s*$/); if(m) return look(m[1],scope); return s.replace(/\{\{([^}]+)\}\}/g,(_,p)=>{const v=look(p,scope);return v==null?'':String(v);}); }
function proc(node, scope, out){
  if(node.nodeType===3){ out.appendChild(document.createTextNode(interp(node.nodeValue,scope))); return; }
  if(node.nodeType!==1) return;
  const tag=node.tagName.toLowerCase();
  if(tag==='sc-if'){ if(interp(node.getAttribute('value'),scope)) for(const c of node.childNodes) proc(c,scope,out); return; }
  if(tag==='sc-for'){ const list=interp(node.getAttribute('list'),scope)||[]; const as=node.getAttribute('as'); list.forEach((it,i)=>{ const sc=[{[as]:it,$index:i},...scope]; for(const c of node.childNodes) proc(c,sc,out); }); return; }
  const isSvg = node.namespaceURI && node.namespaceURI.indexOf('svg')>=0;
  const e = isSvg ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : document.createElement(tag);
  for(const a of node.attributes){ if(a.name.startsWith('on')){ const f=interp(a.value,scope); let ev=a.name.slice(2); if(ev==='change') ev='input'; if(typeof f==='function') e.addEventListener(ev,f); continue; }
    const v=interp(a.value,scope); if(v===false||v==null) continue; e.setAttribute(a.name, String(v)); }
  for(const c of node.childNodes) proc(c,scope,e);
  out.appendChild(e);
}
window.boot = function(src){
  const doc=new DOMParser().parseFromString(src,'text/html');
  const xdc=doc.querySelector('x-dc'); const helmet=xdc.querySelector('helmet');
  for(const s of helmet.querySelectorAll('style')) document.head.appendChild(Object.assign(document.createElement('style'),{textContent:s.textContent}));
  helmet.remove();
  const code=doc.querySelector('script[data-dc-script]').textContent;
  const Comp=(new Function(code+'; return Component;'))();
  const comp=new Comp({}); const root=document.getElementById('root');
  window.__rerender=()=>{ const vals=comp.renderVals(); root.innerHTML=''; for(const c of xdc.childNodes) proc(c,[vals],root); };
  window.__rerender(); if(comp.componentDidMount) comp.componentDidMount(); window.__comp=comp;
};
